[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorforge"
version = "0.1.0"
description = "Approximate nearest-neighbour search from scratch: exact, IVF, product quantisation and HNSW, benchmarked against Faiss."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "fastapi>=0.110", "httpx>=0.27"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["vectorforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
